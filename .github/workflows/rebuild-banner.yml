name: Rebuild profile banner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rebuild-banner.yml"
      - "profile/.banner_chunks/**"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild banner binary
        run: |
          cat profile/.banner_chunks/chunk_*.txt | base64 --decode > profile/banner.webp
          test "$(stat -c%s profile/banner.webp)" -eq 15556
          file profile/banner.webp

      - name: Commit valid banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/banner.webp
          if git diff --cached --quiet; then
            echo "Banner already correct."
            exit 0
          fi
          git commit -m "Rebuild valid profile banner"
          git push
