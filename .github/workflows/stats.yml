name: Generate profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stats.yml"
      - "profile/generate_stats.py"

permissions:
  contents: write

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generate stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python profile/generate_stats.py

      - name: Commit updated stats
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- profile/stats.svg; then
            echo "Stats are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git commit -m "Update profile stats"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Stats pushed successfully."
              exit 0
            fi

            sleep $((attempt * 2))
          done

          echo "Failed to push stats after 3 attempts."
          exit 1
