name: Rebuild profile banner v3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rebuild-banner-v3.yml"
      - "profile/.banner_upload/**"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild banner
        run: |
          cat profile/.banner_upload/chunk_*.txt | base64 --decode > profile/banner-v3.webp
          test "$(stat -c%s profile/banner-v3.webp)" -eq 26936
          file profile/banner-v3.webp

      - name: Commit banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/banner-v3.webp
          if git diff --cached --quiet; then
            echo "Banner already correct."
            exit 0
          fi
          git commit -m "Update profile banner"
          git push
